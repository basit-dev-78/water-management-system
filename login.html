<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" name="viewport" />
    <title>AquaFlow Pro - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./assets/js/config.js"></script>
    <link href="./assets/css/style.css" rel="stylesheet" />
</head>

<body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Animated Organic Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob blob-1" style="width: 50vw; height: 50vw; top: -10%; left: -10%;"></div>
        <div class="blob blob-2" style="width: 40vw; height: 40vw; bottom: -10%; right: -10%;"></div>
        <div class="blob blob-3" style="width: 30vw; height: 30vw; top: 30%; left: 40%;"></div>
    </div>

    <div class="glass-card w-full max-w-md rounded-3xl p-8 border border-white/40 shadow-2xl z-10 m-4 flex flex-col relative animate-sim-slide-up">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-primary mx-auto flex items-center justify-center text-on-primary shadow-lg shadow-primary/30 mb-4">
                <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">water_drop</span>
            </div>
            <h1 class="font-display-lg text-[24px] font-bold text-gradient tracking-tight">AquaFlow Pro</h1>
            <p class="text-[12px] text-on-surface-variant mt-1">Management Portal Login</p>
        </div>

        <form id="login-form" class="flex flex-col gap-5">
            <div class="flex flex-col gap-1.5 relative">
                <label for="email" class="text-[11px] font-bold text-on-surface-variant ml-1">Email Address</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors text-[18px]">mail</span>
                    <input type="email" id="email" required placeholder="admin@aquaflow.com" 
                        class="w-full bg-surface-container-low/60 border border-outline-variant/30 rounded-xl py-3 pl-10 pr-3 text-[13px] focus:ring-2 focus:ring-primary/30 focus:border-primary/50 outline-none transition-all shadow-inner" />
                </div>
            </div>

            <div class="flex flex-col gap-1.5 relative">
                <div class="flex items-center justify-between ml-1">
                    <label for="password" class="text-[11px] font-bold text-on-surface-variant">Password</label>
                    <a href="#" class="text-[10px] text-primary font-bold hover:underline">Forgot password?</a>
                </div>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors text-[18px]">lock</span>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full bg-surface-container-low/60 border border-outline-variant/30 rounded-xl py-3 pl-10 pr-10 text-[13px] focus:ring-2 focus:ring-primary/30 focus:border-primary/50 outline-none transition-all shadow-inner" />
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-on-surface transition-colors focus:outline-none" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';">
                        <span class="material-symbols-outlined text-[18px]">visibility</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2 mt-1 ml-1">
                <input type="checkbox" id="remember" class="rounded border-outline-variant/30 text-primary focus:ring-primary/30 h-4 w-4 cursor-pointer" />
                <label for="remember" class="text-[11px] font-medium text-on-surface-variant select-none cursor-pointer">
                    Remember me for 30 days
                </label>
            </div>

            <button type="button" onclick="window.location.href='dashboard.html'" 
                class="mt-4 w-full bg-gradient-to-r from-[#0f5238] to-[#1a734e] text-white rounded-xl py-3 px-4 font-bold text-[13px] shadow-[0_8px_20px_rgba(15,82,56,0.3)] hover:shadow-[0_10px_25px_rgba(15,82,56,0.4)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2">
                Sign In
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>
        
        <div class="mt-8 text-center text-[10px] text-on-surface-variant/60">
            &copy; 2026 AquaFlow Pro System. All rights reserved.
        </div>
    </div>

    <!-- Theme Toggle (Bottom Right) -->
    <button id="btn-theme-toggle-login"
        class="fixed bottom-6 right-6 w-10 h-10 bg-surface/50 backdrop-blur-md border border-outline-variant/20 rounded-full flex items-center justify-center text-on-surface hover:bg-surface shadow-md transition-all z-50">
        <span class="material-symbols-outlined text-[20px] dark-icon">dark_mode</span>
        <span class="material-symbols-outlined text-[20px] light-icon hidden">light_mode</span>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('btn-theme-toggle-login');
            if(btn) {
                btn.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    const isDark = document.documentElement.classList.contains('dark');
                    btn.querySelector('.dark-icon').classList.toggle('hidden', isDark);
                    btn.querySelector('.light-icon').classList.toggle('hidden', !isDark);
                });
            }
        });
    </script>
</body>
</html>
