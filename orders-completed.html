<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
        name="viewport" />
    <title>AquaFlow Pro - Management Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- External config and styles -->
    <script src="./assets/js/config.js"></script>
    <link href="./assets/css/style.css" rel="stylesheet" />
</head>

<body
    class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-clip relative min-h-screen">

    <!-- Animated Organic Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="relative z-50"></div>

    <!-- Main Content Area -->
    <main
        class="mx-0 px-3 md:px-0 md:ml-[270px] md:mr-4 mt-0 md:mt-4 mb-0 md:mb-4 pb-[100px] md:pb-4 min-h-[calc(100vh-32px)] flex flex-col z-10 relative transition-all duration-300">
        <!-- Header Container -->
        <div id="header-container" class="sticky top-0 z-40 md:-mx-4 md:px-4 pt-0 md:pt-4"></div>
        <!-- ORDERS PANEL -->
        <div id="panel-orders" class="panel active">
            <div class="flex justify-end items-center mb-5 gap-2">
                <button
                    class="flex items-center gap-1.5 bg-primary text-on-primary px-4 py-1.5 rounded-lg hover:shadow-md transition-all text-[11px] font-bold shadow-sm">
                    <span class="material-symbols-outlined text-[16px]">add</span>
                    New Order
                </button>
            </div>

            <!-- Order Pipeline -->
            <div class="grid grid-cols-1 gap-gutter-md mb-gutter-md">
                <div class="glass-card rounded-xl p-card-padding shadow-sm border-t-4 border-t-primary">
                    <p class="text-[11px] text-on-surface-variant font-medium uppercase tracking-wider mb-1">Completed
                        Today</p>
                    <h3 class="text-[24px] font-bold text-on-surface" id="kpi-orders-completed">156</h3>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="glass-card rounded-xl shadow-sm overflow-hidden">
                <div
                    class="px-container-margin py-4 border-b border-outline-variant/10 flex justify-between items-center bg-surface-container-low/80 backdrop-blur-md">
                    <h3 class="text-[14px] font-bold text-on-surface">Completed Orders History</h3>
                    <div class="flex items-center gap-3">
                        <span id="pagination-orders-info"
                            class="text-[11px] text-on-surface-variant font-medium">Showing 0 of 0</span>
                        <div class="flex border border-outline-variant rounded-md overflow-hidden">
                            <button id="btn-prev-orders"
                                class="p-1 hover:bg-surface-container-low text-on-surface-variant disabled:opacity-50 disabled:cursor-not-allowed"><span
                                    class="material-symbols-outlined text-[16px]">chevron_left</span></button>
                            <button id="btn-next-orders"
                                class="p-1 hover:bg-surface-container-low text-on-surface-variant border-l border-outline-variant disabled:opacity-50 disabled:cursor-not-allowed"><span
                                    class="material-symbols-outlined text-[16px]">chevron_right</span></button>
                        </div>
                    </div>
                </div>

                <!-- Data Table Container -->
                <div class="overflow-x-auto w-full p-0">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-surface-variant/30 text-[10px] uppercase tracking-wider text-on-surface-variant border-b border-outline-variant/20">
                                <th class="px-4 py-3 font-bold">Order Details</th>
                                <th class="px-4 py-3 font-bold">Status</th>
                                <th class="px-4 py-3 font-bold">Total</th>
                                <th class="px-4 py-3 font-bold">Items</th>
                                <th class="px-4 py-3 font-bold">Ordered Date</th>
                                <th class="px-4 py-3 font-bold">Expected Date</th>
                                <th class="px-4 py-3 font-bold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-card-list" class="text-[12px] divide-y divide-outline-variant/10">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- END ORDERS PANEL -->
    </main>


    <!-- Scripts -->
    <script src="./assets/js/db.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>

</html>
