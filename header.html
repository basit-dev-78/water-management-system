<header
    class="glass-card rounded-none md:rounded-2xl mb-4 md:mb-6 px-4 md:px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 md:top-4 z-30 border-b md:border border-white/50 transition-all pt-[max(env(safe-area-inset-top),16px)] md:pt-4">
    <div class="flex items-center gap-3 md:gap-stack-md">
        <h2 id="header-title" class="font-display-lg text-[20px] md:text-[22px] text-gradient tracking-tight font-bold">Dashboard</h2>
        <div
            class="bg-surface-variant/30 flex items-center px-3 py-1 rounded-full border border-outline-variant/20 hidden md:flex">
            <span class="material-symbols-outlined text-[14px] mr-1.5">calendar_today</span>
            <span class="text-[11px] font-medium text-on-surface-variant">Monday, June 22</span>
        </div>
    </div>
    <div class="flex items-center gap-stack-md">
        <div class="hidden sm:block relative sm:w-40 md:w-56 group">
            <input
                class="w-full bg-surface-container-low/50 backdrop-blur-md border border-white/40 rounded-full py-2 pl-9 pr-3 text-[11px] focus:ring-2 focus:ring-[#0f5238]/30 transition-all outline-none shadow-inner"
                placeholder="Global search..." type="text" />
            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[16px] opacity-60">search</span>
        </div>
        <div class="flex items-center gap-3">
            <button
                class="relative w-9 h-9 bg-white/40 border border-white rounded-full flex items-center justify-center text-on-surface hover:bg-white hover:shadow-md transition-all hover:scale-105">
                <span class="material-symbols-outlined text-[20px]">notifications</span>
                <span
                    class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full border border-white animate-pulse"></span>
            </button>
            <div class="h-8 w-px bg-outline-variant/30 mx-1"></div>
            <div class="flex items-center gap-2 cursor-pointer group">
                <div class="text-right hidden xl:block">
                    <p
                        class="font-title-sm text-[12px] font-bold leading-none group-hover:text-[#0f5238] transition-colors">
                        Alex Henderson</p>
                    <p class="text-[10px] text-on-surface-variant/80 mt-0.5 leading-none">Operations Lead</p>
                </div>
                <div
                    class="w-10 h-10 rounded-full bg-gradient-to-br from-[#0f5238] to-[#95d4b3] p-0.5 shadow-md group-hover:scale-105 transition-transform">
                    <img alt="User profile" class="w-full h-full rounded-full object-cover border-2 border-white"
                        src="https://i.pravatar.cc/150?u=a042581f4e29026704d" />
                </div>
            </div>
        </div>
    </div>
</header>
