<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
        name="viewport" />
    <title>AquaFlow Pro - Management Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- External config and styles -->
    <script src="./assets/js/config.js"></script>
    <link href="./assets/css/style.css" rel="stylesheet" />
</head>

<body
    class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-clip relative min-h-screen">

    <!-- Animated Organic Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="relative z-50"></div>

    <!-- Main Content Area -->
    <main
        class="mx-0 px-3 md:px-0 md:ml-[270px] md:mr-4 mt-0 md:mt-4 mb-0 md:mb-4 pb-[100px] md:pb-4 min-h-[calc(100vh-32px)] flex flex-col z-10 relative transition-all duration-300">
        <!-- Header Container -->
        <div id="header-container" class="sticky top-0 z-40 md:-mx-4 md:px-4 pt-0 md:pt-4"></div>
        <!-- ADD INVENTORY PANEL -->
        <div id="panel-inventory-add" class="panel active">
            <a class="flex items-center gap-1.5 text-[12px] font-bold text-on-surface-variant hover:text-primary transition-colors mb-4 w-fit"
                href="inventory.html">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Back to Inventory
            </a>
            <div class="glass-card rounded-xl p-6 md:p-8 shadow-sm max-w-4xl mx-auto mb-8">
                <form id="form-inventory-add" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Item Name *</label>
                        <input type="text" name="name" id="inv-name" required
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="e.g. 10 Gallon Jug">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">SKU</label>
                        <input type="text" name="sku" id="inv-sku"
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="JUG-10G">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Initial Quantity</label>
                        <input type="number" name="stock" id="inv-stock"
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="0">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Low Stock Alert Threshold</label>
                        <input type="number" name="threshold" id="inv-threshold"
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="50">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Category *</label>
                        <select name="category" id="inv-category" required
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none cursor-pointer">
                            <option>Containers</option>
                            <option>Filtration</option>
                            <option>Parts</option>
                            <option>Equipment</option>
                        </select>
                    </div>
                    <!-- Spacer for fixed footer -->
                    <div class="col-span-1 md:col-span-2 h-24 md:h-8"></div>
                </form>
            </div>

            <!-- Fixed Form Actions Footer -->
            <div
                class="fixed bottom-[calc(68px+env(safe-area-inset-bottom,0px))] md:bottom-0 right-0 left-0 md:left-[270px] bg-white/70 backdrop-blur-xl border-t border-white/60 px-4 md:px-8 py-3 md:py-4 flex justify-end gap-3 z-[40] shadow-[0_-4px_24px_rgba(0,0,0,0.05)]">
                <button type="button"
                    class="px-5 py-2 text-[12px] font-bold text-on-surface-variant bg-surface-variant/30 hover:bg-surface-variant/50 rounded-lg transition-colors form-btn-cancel">Cancel</button>
                <button type="button"
                    class="px-5 py-2 text-[12px] font-bold text-white bg-gradient-to-r from-[#0f5238] to-[#1a734e] rounded-lg shadow-md hover:shadow-lg hover:scale-105 transition-all form-btn-save">Save
                    Item</button>
            </div>
        </div>
        <!-- END ADD INVENTORY PANEL -->
    </main>


    <!-- Scripts -->
    <script src="./assets/js/db.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>

</html>
