<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
        name="viewport" />
    <title>AquaFlow Pro - Management Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- External config and styles -->
    <script src="./assets/js/config.js"></script>
    <link href="./assets/css/style.css" rel="stylesheet" />
</head>

<body
    class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-clip relative min-h-screen">

    <!-- Animated Organic Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="relative z-50"></div>

    <!-- Main Content Area -->
    <main
        class="mx-0 px-3 md:px-0 md:ml-[270px] md:mr-4 mt-0 md:mt-4 mb-0 md:mb-4 pb-[100px] md:pb-4 min-h-[calc(100vh-32px)] flex flex-col z-10 relative transition-all duration-300">
        <!-- Header Container -->
        <div id="header-container" class="sticky top-0 z-40 md:-mx-4 md:px-4 pt-0 md:pt-4"></div>
        <!-- ADD CUSTOMER PANEL -->
        <div id="panel-customer-add" class="panel active">
            <a class="flex items-center gap-1.5 text-[12px] font-bold text-on-surface-variant hover:text-primary transition-colors mb-4 w-fit"
                href="customers.html">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Back to Customers
            </a>
            <div class="glass-card rounded-xl p-6 md:p-8 shadow-sm max-w-4xl mx-auto mb-8">
                <form id="form-customer-add" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-1 md:col-span-2">
                        <h3 class="text-[14px] font-bold text-on-surface border-b border-outline-variant/20 pb-2 mb-4">
                            Company Details</h3>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Company Name / Customer Name
                            *</label>
                        <input type="text" name="name" id="cust-name" required
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 focus:border-[#0f5238]/50 transition-all outline-none"
                            placeholder="e.g. Acme Corp">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Contract Type</label>
                        <select name="contract" id="cust-contract"
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 transition-all outline-none cursor-pointer">
                            <option>Monthly Subscription</option>
                            <option>Pay As You Go</option>
                            <option>Annual Enterprise</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Starting Balance / Pending Amount (Rs.)</label>
                        <input type="number" name="pendingAmount" id="cust-pending" step="0.01" min="0" value="0.00"
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 focus:border-[#0f5238]/50 transition-all outline-none"
                            placeholder="0.00">
                    </div>
                    <div class="col-span-1 md:col-span-2 mt-4">
                        <h3 class="text-[14px] font-bold text-on-surface border-b border-outline-variant/20 pb-2 mb-4">
                            Primary Contact</h3>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Contact Name</label>
                        <input type="text" name="contact" id="cust-contact"
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="John Doe">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Email Address *</label>
                        <input type="email" name="email" id="cust-email" required
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="john@example.com">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-on-surface-variant">Phone Number *</label>
                        <input type="text" name="phone" id="cust-phone" required
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="(555) 123-4567">
                        <label class="flex items-center gap-2 mt-1 cursor-pointer w-fit group">
                            <input type="checkbox" name="whatsapp" id="cust-whatsapp"
                                class="w-4 h-4 rounded border-outline-variant/40 text-[#25D366] focus:ring-[#25D366]/30 cursor-pointer accent-[#25D366]">
                            <span class="flex items-center gap-1.5 text-[11px] text-on-surface-variant group-hover:text-on-surface transition-colors select-none">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-3.5 h-3.5 fill-[#25D366] shrink-0">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                                </svg>
                                Also available on WhatsApp
                            </span>
                        </label>
                    </div>
                    <div class="flex flex-col gap-1.5 col-span-1 md:col-span-2">
                        <label class="text-[11px] font-bold text-on-surface-variant">Delivery Address</label>
                        <input type="text" name="address" id="cust-address"
                            class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none"
                            placeholder="123 Main St, City, Zip">
                    </div>
                    <!-- Spacer for fixed footer -->
                    <div class="col-span-1 md:col-span-2 h-24 md:h-8"></div>
                </form>
            </div>

            <!-- Fixed Form Actions Footer -->
            <div
                class="fixed bottom-[calc(68px+env(safe-area-inset-bottom,0px))] md:bottom-0 right-0 left-0 md:left-[270px] bg-white/70 backdrop-blur-xl border-t border-white/60 px-4 md:px-8 py-3 md:py-4 flex justify-end gap-3 z-[40] shadow-[0_-4px_24px_rgba(0,0,0,0.05)]">
                <button type="button"
                    class="px-5 py-2 text-[12px] font-bold text-on-surface-variant bg-surface-variant/30 hover:bg-surface-variant/50 rounded-lg transition-colors form-btn-cancel">Cancel</button>
                <button type="button"
                    class="px-5 py-2 text-[12px] font-bold text-white bg-gradient-to-r from-[#0f5238] to-[#1a734e] rounded-lg shadow-md hover:shadow-lg hover:scale-105 transition-all form-btn-save">Save
                    Customer</button>
            </div>
        </div>
        <!-- END ADD CUSTOMER PANEL -->
    </main>


    <!-- Scripts -->
    <script src="./assets/js/db.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>

</html>
