<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
        name="viewport" />
    <title>AquaFlow Pro - Drivers Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- External config and styles -->
    <script src="./assets/js/config.js"></script>
    <link href="./assets/css/style.css" rel="stylesheet" />
</head>

<body
    class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-clip relative min-h-screen">

    <!-- Animated Organic Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="relative z-50"></div>

    <!-- Main Content Area -->
    <main
        class="mx-0 px-3 md:px-0 md:ml-[270px] md:mr-4 mt-0 md:mt-4 mb-0 md:mb-4 pb-[100px] md:pb-4 min-h-[calc(100vh-32px)] flex flex-col z-10 relative transition-all duration-300">
        <!-- Header Container -->
        <div id="header-container" class="sticky top-0 z-40 md:-mx-4 md:px-4 pt-0 md:pt-4"></div>
        
        <!-- DRIVERS PANEL -->
        <div id="panel-drivers" class="panel active">
            <!-- Filter & Action Header -->
            <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3 mb-5 mt-2">
                <!-- Search bar -->
                <div class="flex items-center bg-surface-container-low/80 backdrop-blur-md px-3 py-1.5 rounded-xl border border-outline-variant/10 w-full md:w-80 shadow-sm">
                    <span class="material-symbols-outlined text-[18px] text-on-surface-variant/50 mr-2">search</span>
                    <input id="drivers-search" type="text" placeholder="Search drivers, vehicles, tasks..." class="bg-transparent border-0 p-0 text-[12px] placeholder:text-on-surface-variant/40 focus:ring-0 outline-none w-full" />
                </div>
                
                <!-- Action Buttons -->
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <button id="btn-new-driver" class="flex-1 md:flex-none flex items-center justify-center gap-1.5 bg-primary text-on-primary px-4 py-2 rounded-xl hover:shadow-md hover:bg-primary/95 transition-all text-[11px] font-bold shadow-sm active:scale-[0.98]">
                        <span class="material-symbols-outlined text-[16px]">person_add</span>
                        New Driver
                    </button>
                </div>
            </div>

            <!-- Drivers Stats Bento -->
            <div class="grid grid-cols-3 gap-3 md:gap-gutter-md mb-gutter-md">
                <div class="glass-card rounded-xl p-3 md:p-card-padding shadow-sm flex flex-col justify-between">
                    <div>
                        <span class="material-symbols-outlined text-primary text-[20px] md:text-[24px]">face</span>
                        <p class="text-[9px] md:text-[10px] text-on-surface-variant font-bold uppercase tracking-wider mt-1">Available</p>
                    </div>
                    <h3 id="driver-stat-available" class="text-[20px] md:text-[24px] font-bold text-primary mt-2">0</h3>
                </div>
                <div class="glass-card rounded-xl p-3 md:p-card-padding shadow-sm flex flex-col justify-between">
                    <div>
                        <span class="material-symbols-outlined text-secondary text-[20px] md:text-[24px]">local_shipping</span>
                        <p class="text-[9px] md:text-[10px] text-on-surface-variant font-bold uppercase tracking-wider mt-1">On Route</p>
                    </div>
                    <h3 id="driver-stat-ondelivery" class="text-[20px] md:text-[24px] font-bold text-secondary mt-2">0</h3>
                </div>
                <div class="glass-card rounded-xl p-3 md:p-card-padding shadow-sm flex flex-col justify-between">
                    <div>
                        <span class="material-symbols-outlined text-on-surface-variant text-[20px] md:text-[24px]">event_busy</span>
                        <p class="text-[9px] md:text-[10px] text-on-surface-variant font-bold uppercase tracking-wider mt-1">Off Duty</p>
                    </div>
                    <h3 id="driver-stat-offduty" class="text-[20px] md:text-[24px] font-bold text-on-surface-variant mt-2">0</h3>
                </div>
            </div>

            <!-- Dynamic Drivers Grid -->
            <div id="drivers-card-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 min-h-[250px] mb-8">
                <!-- Loaded dynamically via drivers.js -->
            </div>
        </div>
        <!-- END DRIVERS PANEL -->
    </main>





    <!-- Scripts -->
    <script src="./assets/js/db.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>

</html>
