<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
        name="viewport" />
    <title>AquaFlow Pro - General Settings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./assets/js/config.js"></script>
    <link href="./assets/css/style.css" rel="stylesheet" />
</head>

<body
    class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-clip relative min-h-screen">

    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="sidebar-container" class="relative z-50"></div>

    <main
        class="mx-0 px-3 md:px-0 md:ml-[270px] md:mr-4 mt-0 md:mt-4 mb-0 md:mb-4 pb-[100px] md:pb-24 min-h-[calc(100vh-32px)] flex flex-col z-10 relative transition-all duration-300">
        
        <div id="header-container" class="sticky top-0 z-40 md:-mx-4 md:px-4 pt-0 md:pt-4"></div>

        <div id="panel-settings-general" class="panel active">
            
            <a class="flex items-center gap-1.5 text-[12px] font-bold text-on-surface-variant hover:text-primary transition-colors mb-4 w-fit" href="#">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Back to Dashboard
            </a>

            <!-- Form Card Wrapper -->
            <div class="glass-card border border-outline-variant/20 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.04)] w-[98%] mx-auto overflow-hidden">
                
                <!-- Gradient Header -->
                <div class="bg-gradient-to-r from-primary to-primary-container p-6 text-white flex items-center justify-between">
                    <div>
                        <h2 class="text-[18px] font-bold">General Settings</h2>
                        <p class="text-[12px] text-white/80 mt-1">Configure core business information</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
                        <span class="material-symbols-outlined text-[20px]">settings</span>
                    </div>
                </div>

                <div class="p-6">
                    <form id="form-settings" class="space-y-5">
                        
                        <!-- Company Info -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                            <div class="col-span-1 md:col-span-2">
                                <h3 class="text-[14px] font-bold text-on-surface border-b border-outline-variant/20 pb-2 mb-4">
                                    General Information</h3>
                            </div>
                            
                            <div class="floating-label-group mb-2">
                                <input type="text" id="company-name" name="companyName" required class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none" placeholder=" ">
                                <label for="company-name">Company Name *</label>
                            </div>
                            
                            <div class="floating-label-group mb-2">
                                <input type="text" id="company-phone" name="phone" required class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none" placeholder=" ">
                                <label for="company-phone">Contact Phone *</label>
                            </div>

                            <div class="floating-label-group mb-2">
                                <input type="email" id="company-email" name="email" class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none" placeholder=" ">
                                <label for="company-email">Contact Email</label>
                            </div>

                            <div class="floating-label-group mb-2">
                                <input type="text" id="company-address" name="address" class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none" placeholder=" ">
                                <label for="company-address">Office Address</label>
                            </div>

                            <div class="floating-label-group mb-2">
                                <input type="text" id="currency-symbol" name="currency" maxlength="5" class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none" placeholder=" ">
                                <label for="currency-symbol">Currency Symbol</label>
                            </div>

                            <div class="floating-label-group mb-2">
                                <select id="date-format" name="dateFormat" class="w-full bg-white/50 border border-outline-variant/30 rounded-lg py-2 px-3 text-[12px] focus:ring-2 focus:ring-[#0f5238]/30 outline-none cursor-pointer">
                                    <option value="YYYY-MM-DD">YYYY-MM-DD (e.g. 2026-06-03)</option>
                                    <option value="DD/MM/YYYY">DD/MM/YYYY (e.g. 03/06/2026)</option>
                                    <option value="MM/DD/YYYY">MM/DD/YYYY (e.g. 06/03/2026)</option>
                                </select>
                                <label for="date-format">Date Format</label>
                            </div>
                        </div>
                        </form>
                </div>
            </div>


<!-- Fixed Footer -->
            <div class="fixed bottom-[calc(68px+env(safe-area-inset-bottom,0px))] md:bottom-0 right-0 left-0 md:left-[270px] bg-white/70 backdrop-blur-xl border-t border-white/60 px-4 md:px-8 py-3 md:py-4 flex justify-end gap-3 z-[40] shadow-[0_-4px_24px_rgba(0,0,0,0.05)]">
                <a href="#" class="px-5 py-2 text-[12px] font-bold text-on-surface-variant bg-surface-variant/30 hover:bg-surface-variant/50 rounded-lg transition-colors inline-block">Cancel</a>
                <button type="submit" form="form-settings" id="btn-settings-save" class="px-5 py-2 text-[12px] font-bold text-white bg-gradient-to-r from-[#0f5238] to-[#1a734e] rounded-lg shadow-md hover:shadow-lg hover:scale-105 transition-all">Save Settings</button>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="./assets/js/db.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>

</html>
