<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
        name="viewport" />
    <title>AquaFlow Pro - Management Portal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- External config and styles -->
    <script src="./assets/js/config.js"></script>
    <link href="./assets/css/style.css" rel="stylesheet" />
</head>

<body
    class="bg-[#f0f4f2] text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-clip relative min-h-screen">

    <!-- Animated Organic Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="relative z-50"></div>

    <!-- Main Content Area -->
    <main
        class="mx-0 px-3 md:px-0 md:ml-[270px] md:mr-4 mt-0 md:mt-4 mb-0 md:mb-4 pb-[100px] md:pb-4 min-h-[calc(100vh-32px)] flex flex-col z-10 relative transition-all duration-300">
        <!-- Header Container -->
        <div id="header-container" class="sticky top-0 z-40 md:-mx-4 md:px-4 pt-0 md:pt-4"></div>
        <!-- INVENTORY PANEL -->
        <div id="panel-inventory" class="panel active">
            <div class="flex justify-end items-center mb-5 gap-2">
                <button
                    class="flex items-center gap-1.5 bg-white border border-outline-variant px-3 py-1.5 rounded-lg text-on-surface-variant hover:bg-surface-container-low transition-colors text-[11px] font-medium shadow-sm">
                    <span class="material-symbols-outlined text-[16px]">file_download</span>
                    Export
                </button>
                <button
                    class="flex items-center gap-1.5 bg-primary text-on-primary px-4 py-1.5 rounded-lg hover:shadow-md transition-all text-[11px] font-bold shadow-sm">
                    <span class="material-symbols-outlined text-[16px]">add</span>
                    Add Stock
                </button>
            </div>

            <!-- Bento Stats -->
            <div class="grid grid-cols-2 gap-gutter-md mb-gutter-md">
                <div class="glass-card rounded-xl p-card-padding shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                            <span class="material-symbols-outlined text-[20px]">water_bottle</span>
                        </div>
                        <span class="text-primary bg-primary/10 px-2 py-0.5 rounded text-[10px] font-bold">Stable</span>
                    </div>
                    <p class="text-[11px] text-on-surface-variant font-medium uppercase tracking-wider mb-1">Total Items
                    </p>
                    <h3 class="text-[22px] font-bold text-on-surface">14,250 <span
                            class="text-[12px] font-normal text-on-surface-variant">units</span></h3>
                </div>
                <div class="glass-card rounded-xl p-card-padding shadow-sm border border-error/20">
                    <div class="flex justify-between items-start mb-2">
                        <div class="w-10 h-10 rounded-full bg-error/10 text-error flex items-center justify-center">
                            <span class="material-symbols-outlined text-[20px]">warning</span>
                        </div>
                        <span class="text-error bg-error/10 px-2 py-0.5 rounded text-[10px] font-bold">Needs
                            Action</span>
                    </div>
                    <p class="text-[11px] text-on-surface-variant font-medium uppercase tracking-wider mb-1">Low Stock
                        Alerts</p>
                    <h3 class="text-[22px] font-bold text-error">12 <span
                            class="text-[12px] font-normal text-on-surface-variant">items</span></h3>
                </div>
                <div class="glass-card rounded-xl p-card-padding shadow-sm col-span-2">
                    <div class="flex justify-between items-start mb-2">
                        <div
                            class="w-10 h-10 rounded-full bg-secondary/10 text-secondary flex items-center justify-center">
                            <span class="material-symbols-outlined text-[20px]">account_balance_wallet</span>
                        </div>
                    </div>
                    <p class="text-[11px] text-on-surface-variant font-medium uppercase tracking-wider mb-1">Inventory
                        Value</p>
                    <h3 class="text-[22px] font-bold text-on-surface">$142,500.00</h3>
                </div>
            </div>

            <!-- Inventory Table -->
            <div class="glass-card rounded-xl shadow-sm overflow-hidden">
                <div
                    class="px-container-margin py-4 border-b border-outline-variant/10 flex justify-between items-center bg-surface-container-low/80 backdrop-blur-md flex-wrap gap-2">
                    <h3 class="text-[14px] font-bold text-on-surface">Stock Directory</h3>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3">
                            <span id="pagination-inventory-info"
                                class="text-[11px] text-on-surface-variant font-medium">Showing 0 of 0</span>
                            <div class="flex border border-outline-variant rounded-md overflow-hidden">
                                <button id="btn-prev-inventory"
                                    class="p-1 hover:bg-surface-container-low text-on-surface-variant disabled:opacity-50 disabled:cursor-not-allowed"><span
                                        class="material-symbols-outlined text-[16px]">chevron_left</span></button>
                                <button id="btn-next-inventory"
                                    class="p-1 hover:bg-surface-container-low text-on-surface-variant border-l border-outline-variant disabled:opacity-50 disabled:cursor-not-allowed"><span
                                        class="material-symbols-outlined text-[16px]">chevron_right</span></button>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[12px] text-on-surface-variant font-medium">Filter by:</span>
                            <select
                                class="bg-transparent border border-outline-variant rounded-md text-[11px] font-bold focus:ring-0 cursor-pointer py-1 px-2">
                                <option>All Categories</option>
                                <option>Bottles</option>
                                <option>Filters</option>
                                <option>Equipment</option>
                            </select>
                        </div>
                    </div>
                </div>
                <!-- Data Cards Grid -->
                <div id="inventory-card-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4"></div>
            </div>
        </div>
        <!-- END INVENTORY PANEL -->
<footer
        class="w-full md:w-[calc(100%-270px)] mt-auto flex flex-col md:flex-row justify-between items-center gap-4 py-4 border-t border-outline-variant/10 px-container-margin md:ml-[270px] relative z-10 text-center">
        <span class="text-on-surface-variant/50 text-[10px]">© 2024 AquaFlow Pro v2.4.1</span>
        <div class="flex flex-wrap justify-center gap-4 md:gap-6">
            <a class="text-on-surface-variant/60 hover:text-on-surface transition-colors text-[10px]" href="#">System
                Status: <span class="text-primary font-bold">Operational</span></a>
            <a class="text-on-surface-variant/60 hover:text-on-surface transition-colors text-[10px]" href="#">Privacy
                Policy</a>
            <a class="text-on-surface-variant/60 hover:text-on-surface transition-colors text-[10px]" href="#">Terms of
                Service</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="./assets/js/db.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>

</html>
