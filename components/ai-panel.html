<!-- AI ASSISTANT SLIDE-OVER PANEL -->
<div id="ai-overlay"
    class="fixed inset-0 bg-surface/50 backdrop-blur-sm z-[100] opacity-0 pointer-events-none transition-opacity duration-300">
</div>
<div id="ai-panel"
    class="fixed top-0 right-0 h-full w-[360px] max-w-[90vw] bg-surface-container-lowest shadow-2xl z-[110] transform translate-x-full transition-transform duration-300 flex flex-col border-l border-outline-variant/20">
    <!-- Header -->
    <div class="px-5 py-4 border-b border-outline-variant/10 flex justify-between items-center bg-primary/5">
        <h3 class="text-[15px] font-bold text-primary flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            AquaFlow AI Assistant
        </h3>
        <button id="btn-close-ai"
            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant/50 text-on-surface-variant transition-colors">
            <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
    </div>

    <!-- Suggestions area -->
    <div class="p-4 border-b border-outline-variant/10 bg-surface-container-low/30">
        <p class="text-[10px] uppercase font-bold text-on-surface-variant/60 tracking-wider mb-2">Suggested Queries</p>
        <div class="flex flex-wrap gap-1.5">
            <button class="ai-suggest-btn text-[10px] font-semibold text-primary bg-primary/5 hover:bg-primary/10 border border-primary/10 px-2.5 py-1 rounded-full transition-colors">
                Stock Alerts
            </button>
            <button class="ai-suggest-btn text-[10px] font-semibold text-primary bg-primary/5 hover:bg-primary/10 border border-primary/10 px-2.5 py-1 rounded-full transition-colors">
                Total Revenue
            </button>
            <button class="ai-suggest-btn text-[10px] font-semibold text-primary bg-primary/5 hover:bg-primary/10 border border-primary/10 px-2.5 py-1 rounded-full transition-colors">
                Active Customers
            </button>
            <button class="ai-suggest-btn text-[10px] font-semibold text-primary bg-primary/5 hover:bg-primary/10 border border-primary/10 px-2.5 py-1 rounded-full transition-colors">
                Suppliers List
            </button>
        </div>
    </div>

    <!-- Chat Message Container -->
    <div id="ai-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
        <!-- AI Greeting -->
        <div class="flex gap-2.5 items-start max-w-[85%]">
            <div class="w-7 h-7 bg-primary text-on-primary rounded-full flex items-center justify-center shrink-0 shadow-sm">
                <span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            </div>
            <div class="bg-surface-container-low p-3 rounded-2xl rounded-tl-none border border-outline-variant/10">
                <p class="text-[11px] font-medium text-on-surface leading-normal">
                    Hello! I'm AquaFlow AI, your operational co-pilot. I can help analyze your inventory, track revenue, list active clients, or check order backlogs. How can I assist you today?
                </p>
            </div>
        </div>
    </div>

    <!-- Footer Input Bar -->
    <div class="p-4 border-t border-outline-variant/10 bg-surface-container-low/50 flex gap-2">
        <input type="text" id="ai-chat-input"
            class="flex-1 bg-white border border-outline-variant/30 rounded-xl py-2 px-3 text-[12px] focus:ring-2 focus:ring-primary/30 outline-none transition-all placeholder-on-surface-variant/40"
            placeholder="Type operations query...">
        <button id="btn-send-ai"
            class="w-9 h-9 bg-primary text-on-primary rounded-xl flex items-center justify-center hover:opacity-95 shadow-sm transition-all shrink-0">
            <span class="material-symbols-outlined text-[18px]">send</span>
        </button>
    </div>
</div>
